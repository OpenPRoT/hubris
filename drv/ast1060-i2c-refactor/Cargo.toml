[package]
name = "drv-ast1060-i2c-refactor"
version = "0.1.0"
edition = "2021"
description = "AST1060 I2C driver for Hubris - delegates to aspeed-ddk i2c_core"

[dependencies]
# Core I2C implementation from aspeed-rust
aspeed-ddk = { git = "https://github.com/OpenPRoT/aspeed-rust.git", branch = "i2c-core" }

# PAC for AST1060 register access
ast1060-pac = { workspace = true }

# Hubris I2C types (includes I2cHardware trait)
drv-i2c-types = { path = "../i2c-types" }

# Hubris utilities
ringbuf = { path = "../../lib/ringbuf" }
counters = { path = "../../lib/counters" }
userlib = { path = "../../sys/userlib" }

[features]
default = []
slave = []  # Enable I2C slave/target mode support

[build-dependencies]
build-util = { path = "../../build/util" }

[lib]
test = false
doctest = false
bench = false

[lints]
workspace = true
